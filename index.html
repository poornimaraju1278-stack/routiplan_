<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>✨ Routine Planner</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css">
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SLIDE 1 -->
<div class="slide active">
    <h1>✨ Routine Planner</h1>
    <p>Plan your day. Improve your life.</p>
    <input id="name" class="form-control w-50 mx-auto" placeholder="Enter your name 👤">
    <button class="btn btn-light mt-3" onclick="nextSlide()">Next ➡️</button>
</div>

<!-- SLIDE 2 -->
<div class="slide">
    <h2>⏰ Your Routine</h2>

    <label>Morning Start 🌅</label>
    <input id="m_start" type="time" class="form-control w-50 mx-auto">

    <label class="mt-2">Morning End ☀️</label>
    <input id="m_end" type="time" class="form-control w-50 mx-auto">

    <label class="mt-2">Night Start 🌙</label>
    <input id="n_start" type="time" class="form-control w-50 mx-auto">

    <label class="mt-2">Night End 😴</label>
    <input id="n_end" type="time" class="form-control w-50 mx-auto">

    <button class="btn btn-primary mt-3" onclick="nextSlide()">Next ➡️</button>
</div>

<!-- SLIDE 3 -->
<div class="slide">
    <h2>🎯 Your Goal</h2>

    <input id="goal" class="form-control w-50 mx-auto" placeholder="Your main goal">

    <select id="category" class="form-select w-50 mx-auto mt-3">
        <option>Study 📚</option>
        <option>Fitness 💪</option>
        <option>Work 💼</option>
        <option>Personal Growth 🌱</option>
    </select>

    <select id="priority" class="form-select w-50 mx-auto mt-3">
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
    </select>

    <button class="btn btn-success mt-3" onclick="generate()">Generate Routine 🧠</button>
</div>

<!-- SLIDE 4 -->
<div class="slide">
    <h2>📋 Your Daily Routine</h2>
    <div id="output" class="mt-3"></div>
</div>

<!-- Python Logic -->
<py-script src="logic.py"></py-script>

<script src="script.js"></script>
</body>
</html>
